<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WinzAI Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0a0e1a;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
.header {
    background: #12172b;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1e2540;
}
.header h1 {
    color: #00ffcc;
    font-size: 20px;
    font-family: monospace;
}
.header .status {
    color: #00ff88;
    font-size: 11px;
}
.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.bubble {
    max-width: 80%;
    padding: 12px 18px;
    border-radius: 20px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.bubble.user {
    align-self: flex-end;
    background: #00cc99;
    color: white;
    border-bottom-right-radius: 5px;
}
.bubble.admin {
    align-self: flex-start;
    background: #1e2540;
    color: #e0e0e0;
    border-bottom-left-radius: 5px;
}
.bubble .time {
    font-size: 10px;
    opacity: 0.6;
    display: block;
    margin-top: 5px;
}
.input-area {
    background: #12172b;
    padding: 15px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #1e2540;
}
.input-area input {
    flex: 1;
    padding: 12px 18px;
    background: #1e2540;
    border: 1px solid #2a2a4a;
    border-radius: 25px;
    color: #fff;
    font-size: 15px;
    outline: none;
}
.input-area input:focus {
    border-color: #00cc99;
}
.input-area input::placeholder {
    color: #666a8a;
}
.input-area button {
    padding: 12px 25px;
    background: #00cc99;
    border: none;
    border-radius: 25px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}
.input-area button:hover {
    background: #00b388;
}
.input-area button:disabled {
    background: #444;
    cursor: not-allowed;
}
.status-banner {
    background: #1a0e0e;
    color: #ff6666;
    padding: 10px 15px;
    font-size: 12px;
    text-align: center;
    display: none;
}
.status-banner.show {
    display: block;
}
</style>
</head>
<body>

<div class="header">
    <div>
        <h1>💬 WinzAI</h1>
        <div class="status" id="statusText">● Online</div>
    </div>
    <div style="text-align: right;">
        <div class="status" id="userInfo">User: -</div>
    </div>
</div>

<div class="status-banner" id="statusBanner"></div>

<div class="chat-area" id="chatArea">
    <div class="bubble admin">
        Halo! Ada yang bisa dibantu? Chat aja langsung 😊
    </div>
</div>

<div class="input-area">
    <input type="text" id="inputMsg" placeholder="Ketik pesan..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Kirim</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
// ============================================
// KONFIGURASI FIREBASE
// ============================================
const firebaseConfig = {
    apiKey: "ISI_API_KEY_FIREBASE",
    authDomain: "ISI_AUTH_DOMAIN",
    databaseURL: "ISI_DATABASE_URL",
    projectId: "ISI_PROJECT_ID",
    storageBucket: "ISI_STORAGE_BUCKET",
    messagingSenderId: "ISI_SENDER_ID",
    appId: "ISI_APP_ID"
};

// Init Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ============================================
// STATE
// ============================================
let userId = localStorage.getItem("winzai_user_id");
if (!userId) {
    userId = "user_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9);
    localStorage.setItem("winzai_user_id", userId);
}

let userName = localStorage.getItem("winzai_user_name");
if (!userName) {
    userName = prompt("Masukkan nama lu:");
    if (!userName) userName = "User";
    localStorage.setItem("winzai_user_name", userName);
}

document.getElementById("userInfo").textContent = "User: " + userName;

let lastCount = 0;

// ============================================
// KIRIM PESAN
// ============================================
function sendMessage() {
    const input = document.getElementById("inputMsg");
    const msg = input.value.trim();
    if (!msg) return;

    const now = new Date();
    const time = now.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });

    // Simpen ke Firebase
    db.ref("chats/" + userId + "/messages").push({
        from: "user",
        name: userName,
        text: msg,
        time: time,
        timestamp: Date.now()
    });

    // Update info user
    db.ref("chats/" + userId + "/info").set({
        name: userName,
        last_update: Date.now()
    });

    input.value = "";
}

// ============================================
// LOAD PESAN
// ============================================
db.ref("chats/" + userId + "/messages").on("value", function(snapshot) {
    const chatArea = document.getElementById("chatArea");
    const data = snapshot.val();

    if (!data) return;

    // Clear chat
    chatArea.innerHTML = "";

    // Convert object to array
    const messages = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);

    // Tampilin
    if (messages.length === 0) {
        chatArea.innerHTML = '<div class="bubble admin">Halo! Ada yang bisa dibantu? Chat aja langsung 😊</div>';
    } else {
        messages.forEach(function(msg) {
            const bubble = document.createElement("div");
            bubble.className = "bubble " + msg.from;
            bubble.innerHTML = msg.text.replace(/\n/g, "<br>") + `<span class="time">${msg.time}</span>`;
            chatArea.appendChild(bubble);
        });
    }

    // Scroll ke bawah
    chatArea.scrollTop = chatArea.scrollHeight;
});

// ============================================
// CEK BAN
// ============================================
db.ref("chats/" + userId + "/info/banned").on("value", function(snapshot) {
    const banned = snapshot.val();
    if (banned === true) {
        document.getElementById("statusBanner").textContent = "🚫 Anda telah dibanned oleh admin!";
        document.getElementById("statusBanner").classList.add("show");
        document.getElementById("statusText").textContent = "● Banned";
        document.getElementById("inputMsg").disabled = true;
        document.getElementById("sendBtn").disabled = true;
    }
});

// ============================================
// CEK WEB LOCK
// ============================================
db.ref("settings/web_locked").on("value", function(snapshot) {
    const locked = snapshot.val();
    if (locked === true) {
        document.getElementById("statusBanner").textContent = "🔒 Web sedang dikunci oleh admin!";
        document.getElementById("statusBanner").classList.add("show");
        document.getElementById("statusText").textContent = "● Locked";
        document.getElementById("inputMsg").disabled = true;
        document.getElementById("sendBtn").disabled = true;
    } else {
        document.getElementById("statusBanner").classList.remove("show");
        document.getElementById("statusText").textContent = "● Online";
        document.getElementById("inputMsg").disabled = false;
        document.getElementById("sendBtn").disabled = false;
    }
});

// ============================================
// EVENT
// ============================================
document.getElementById("inputMsg").addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
});

// Init
console.log("User ID: " + userId);
console.log("User Name: " + userName);
</script>

</body>
</html>
