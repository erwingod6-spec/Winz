<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - VulnWeb</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>LOGIN</h1>
    <p class="subtitle">Username + Password</p>

    <form id="loginForm">
        <input type="text" id="username" name="username" placeholder="Username" required autocomplete="off">
        <input type="password" id="password" name="password" placeholder="Password" required>
        <button type="submit">LOGIN</button>
    </form>

    <div id="result"></div>

    <p class="note">Hint: coba username "admin" dengan password umum.</p>
</div>

<script src="login.js"></script>
</body>
</html>
